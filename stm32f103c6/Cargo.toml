[package]
edition = "2024"
name = "small-battery-charger-stm32f103c6"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Change stm32f103c6 to your chip name, if necessary.
embassy-stm32 = { version = "0.6.0", features = ["stm32f103c6", "unstable-pac", "memory-x", "time-driver-any" ]  }
embassy-sync = { version = "0.8.0" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-usb = { version = "0.6.0" }
embassy-futures = { version = "0.1.2" }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
heapless = { version = "0.9", default-features = false }
static_cell = "2.0.0"
embedded-io-async = "0.7.0"
zerocopy = { version = "0.8.57", features = ["derive"] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 0
lto = true

[package.metadata.embassy]
build = [
  { target = "thumbv7m-none-eabi", artifact-dir = "out/examples/stm32f1" }
]
